name: Windows tests
on:
  push:
    branches: [forwin]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install -e .
      - run: python scripts/test.py
        env:
          PYTHONUTF8: '1'
